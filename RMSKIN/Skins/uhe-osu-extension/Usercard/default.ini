[Rainmeter]
@Include=#SKINSPATH#/uhe/@Resources/Templates/usercard.inc
@Include2=#@#Variables/tokenvariables.inc
@Include3=#SKINSPATH#/uhe/@Resources/Variables/easingvariables.inc
Group=osu | AllSkins
OnRefreshAction=[!CommandMeasure measureNewUpdate Run]

[Metadata]
Author=Joehu
Version=1.0
License=MIT License
Information=A usercard that lists the important stats of osu!.

[Variables]
DropdownHeight=60
BaseFinishAction=[!ShowMeter meterMode][!SetOption meterMode LeftMouseUpAction """#PlayButtonClick#[!SetOption meterMode LeftMouseUpAction ""][!EnableMeasure measureMode][!UpdateMeasure measureMode][!UpdateMeasure measureModeIcon][!CommandMeasure measureData Update][!UpdateMeter meterMode][!Redraw]"""][!EnableMeasure measureUserIDString][!EnableMeasure measureMinimal][!UpdateMeasure measureMinimal][!SetOption meterCard Text "[measureUserName]#CRLF#%1#CRLF#%2#CRLF#%3"][!UpdateMeter meterCard][!Redraw]#BaseFinishAction#[!SetOption meterClick ToolTipText "Left: Change username#CRLF#Right: Go to player info"][!EnableMeasure measureHighestRankDate]
FinishAction=#BaseFinishAction#
BaseOnRegExpErrorAction=[!SetOption meterCard Text "Invalid user"][!SetOption meterCard InlinePattern2 "Invalid user"][!SetOption meterCard InlineSetting2 "Color | #LightHighlight#"]
OnRegExpErrorAction=#BaseOnRegExpErrorAction#
CurrentOsuExtensionVersion=v1.1.0

[measureNewUpdate]
Measure=Plugin
Plugin=RunCommand
Parameter=curl --no-progress-meter -L -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/uhe-org/uhe-osu-extension/releases/latest
OutputType=ANSI
RegExpSubstitute=1
Substitute='[\s\S]*"tag_name": "(.+)"[\s\S]*':"\1"
IfMatch=\d*\.\d*\.\d*
IfMatchAction=[!EnableMeasure measureOpenUpdateDialog][!UpdateMeasure measureOpenUpdateDialog][!DisableMeasure measureOpenUpdateDialog]

[measureOpenUpdateDialog]
Measure=String
String=[measureNewUpdate]
IfMatch=#CurrentOsuExtensionVersion#
IfNotMatchAction=[!ActivateConfig "uhe\Dialogs\Update"][!SetVariable RequestedItem "uhe-osu-extension [measureNewUpdate]" "uhe\Dialogs\Update"][!SetVariable YesAction """["https://github.com/uhe-org/uhe-osu-extension/releases/latest"]""" "uhe\Dialogs\Update"][!Update "uhe\Dialogs\Update"]
UpdateDivider=-1
Disabled=1
DynamicVariables=1

[measureMode]
Measure=String
DynamicVariables=1
String=#Mode#
IfMatch=osu
IfMatchAction=[!SetVariable Mode taiko][!WriteKeyValue Variables Mode taiko "#@#Variables/tokenvariables.inc"][!RefreshGroup osuScore]
IfMatch2=taiko
IfMatchAction2=[!SetVariable Mode fruits][!WriteKeyValue Variables Mode fruits "#@#Variables/tokenvariables.inc"][!RefreshGroup osuScore]
IfMatch3=fruits
IfMatchAction3=[!SetVariable Mode mania][!WriteKeyValue Variables Mode mania "#@#Variables/tokenvariables.inc"][!RefreshGroup osuScore]
IfMatch4=mania
IfMatchAction4=[!SetVariable Mode osu][!WriteKeyValue Variables Mode osu "#@#Variables/tokenvariables.inc"][!RefreshGroup osuScore]
UpdateDivider=-1
Disabled=1

[measureModeName]
Measure=String
DynamicVariables=1
String=#Mode#
Substitute="osu":"osu!","taiko":"osu!taiko","fruits":"osu!catch","mania":"osu!mania"

[measureModeIcon]
Measure=String
DynamicVariables=1
String=#Mode#
IfMatch=osu
IfMatchAction=[!SetOption meterMode Text "[\xf111]"]
IfMatch2=taiko
IfMatchAction2=[!SetOption meterMode Text "[\xf569]"]
IfMatch3=fruits
IfMatchAction3=[!SetOption meterMode Text "[\xf5d1]"]
IfMatch4=mania
IfMatchAction4=[!SetOption meterMode Text "[\xf550]"]

[measureData]
DynamicVariables=1
URL=#HostName#/users/#Username#/#Mode#
Header=Authorization: Bearer %UheOsuToken%
UpdateRate=3600
JsonPointer=1
FinishAction=#FinishAction#

[measureAuth]
Measure=WebParser
URL=[measureData]
JsonPointer=/authentication
IfMatch=basic
IfMatchAction=[!EnableMeasure measureCheckID][!UpdateMeasure measureCheckID][!DisableMeasure measureCheckID]

[measureError]
Measure=WebParser
URL=[measureData]
JsonPointer=/error
IfMatch=null
IfMatchAction=#OnRegExpErrorAction#

[measureCheckID]
Measure=String
DynamicVariables=1
String=%UheOsuClientID%
IfMatch=\%UheOsuClientID\%
IfMatchAction=[!SetOption meterCard Text "Click to enter client id"][!SetOption measureInput Command1 """[!SetVariable inputClientID $UserInput$][!UpdateMeasure measureSetClientID][!CommandMeasure measureSetClientID Run]"""][!SetOption measureInput DefaultValue "Enter client id"][!SetOption meterClick TooltipText "Right: Go to osu! account settings"][!SetOption meterClick RightMouseUpAction """#PlayButtonClick#["https://osu.ppy.sh/home/account/edit"]"""]
IfNotMatchAction=[!EnableMeasure measureCheckSecret][!UpdateMeasure measureCheckSecret][!DisableMeasure measureCheckSecret]
Disabled=1

[measureSetClientID]
Measure=Plugin
Plugin=RunCommand
DynamicVariables=1
Parameter=setx UheOsuClientID #inputClientID#
FinishAction=[!ActivateConfig "uhe\Dialogs\Quit"][!SetVariable Skin "osu! usercard" "uhe\Dialogs\Quit"][!Update "uhe\Dialogs\Quit"]
OutputType=UTF8

[measureCheckSecret]
Measure=String
String=%UheOsuClientSecret%
IfMatch=\%UheOsuClientSecret\%
IfMatchAction=[!SetOption meterCard Text "Click to enter client secret"][!SetOption measureInput Command1 """[!SetVariable inputClientSecret $UserInput$][!UpdateMeasure measureSetClientSecret][!CommandMeasure measureSetClientSecret Run]"""][!SetOption measureInput DefaultValue "Enter client secret"][!SetOption meterClick TooltipText "Right: Go to osu! account settings"][!SetOption meterClick RightMouseUpAction """#PlayButtonClick#["https://osu.ppy.sh/home/account/edit"]"""]
IfNotMatchAction=[!CommandMeasure measureToken "Run"]
Disabled=1

[measureSetClientSecret]
Measure=Plugin
Plugin=RunCommand
DynamicVariables=1
Parameter=setx UheOsuClientSecret #inputClientSecret#
FinishAction=[!ActivateConfig "uhe\Dialogs\Quit"][!SetVariable RequestedItem "osu! usercard" "uhe\Dialogs\Quit"][!Update "uhe\Dialogs\Quit"]
OutputType=UTF8

[measureAvatar]
Measure=WebParser
URL=[measureData]
JsonPointer=/avatar_url
Download=1
DownloadFile=avatar.jpg

[measureUserID]
Measure=WebParser
URL=[measureData]
JsonPointer=/id

[measureUserIDString]
Measure=String
DynamicVariables=1
String=[&measureUserID]
IfCondition=#UserID# = [&measureUserID]
IfFalseAction=[!WriteKeyValue Variables UserID [&measureUserIDString] "#@#Variables/tokenvariables.inc"][!RefreshGroup osuScore]
Disabled=1

[measureUserName]
Measure=WebParser
URL=[measureData]
JsonPointer=/username

[measureCover]
Measure=WebParser
URL=[measureData]
JsonPointer=/cover_url
Download=1
DownloadFile=cover.jpg

[measureHighestRankWeb]
Measure=WebParser
URL=[measureData]
JsonPointer=/rank_highest/rank
RegExpSubstitute=1
Substitute=#FormatNumberWithCommas#

[measureHighestRank]
Measure=String
DynamicVariables=1
String=[measureHighestRankWeb]
RegExpSubstitute=1
Substitute='(.+)':"#\1"

[measureHighestRankDateWeb]
Measure=WebParser
URL=[measureData]
JsonPointer=/rank_highest/updated_at

[measureHighestRankDate]
Measure=Time
DynamicVariables=1
Timestamp=[measureHighestRankDateWeb]
TimeStampFormat=%Y-%m-%dT%H:%M:%SZ
Format=%#d %b %Y
Disabled=1

[measureLevel]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/level/current
RegExpSubstitute=1
Substitute='(.+)':"LV\1"

[measurePercent]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/level/progress
MinValue=0
MaxValue=100

[measurePPString]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/pp

[measurePPCalc]
Measure=Calc
Formula=Round(measurePPString)
RegExpSubstitute=1
Substitute=#FormatNumberWithCommas#

[measurePP]
Measure=String
String=[measurePPCalc]
DynamicVariables=1
RegExpSubstitute=1
Substitute='(.+)':"Performance: \1pp"

[measureRankWeb]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/global_rank
RegExpSubstitute=1
Substitute=#FormatNumberWithCommas#

[measureRank]
Measure=String
DynamicVariables=1
String=[measureRankWeb]
RegExpSubstitute=1
Substitute='(.+)':"#\1"

[measureAccString]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/hit_accuracy

[measureAcc]
Measure=Calc
Formula=Round(measureAccString, 2)
RegExpSubstitute=1
Substitute='(.+)':"Accuracy: \1%"

[measureSS]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/grade_counts/ss

[measureSSH]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/grade_counts/ssh

[measureS]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/grade_counts/s

[measureSH]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/grade_counts/sh

[measureA]
Measure=WebParser
URL=[measureData]
JsonPointer=/statistics/grade_counts/a

[meterAvatar]
MeasureName=measureAvatar
LeftMouseUpAction=#PlayButtonClick#["https://osu.ppy.sh/users/#UserID#"]
ToolTipText=Left: Go to player info
ToolTipTitle=Actions

[meterCover]
MeasureName=measureCover

[meterCard]
MeasureName3=measureLevel
MeasureName=measurePP
MeasureName2=measureAcc
InlineSetting=Size | 18
DynamicVariables=1
InlinePattern=[measureUserName]
Text=Loading...
NumOfDecimals=2
MouseOverAction=#VerticalExpandCommand#
MouseLeaveAction=#VerticalCollapseCommand#

[meterBar]
Meter=Bar
MeasureName=measurePercent
BarOrientation=Horizontal
W=(#InfoWidth# - 50)
H=10
X=50r
Y=-[meterBar:H]R
DynamicVariables=1
BarColor=#LightHighlight#
SolidColor=#BarBackgroundColor#
TooltipText=Progress to next level: %1%

[meterRank]
Meter=String
MeasureName=measureRank
FontFace=#FontFace#
FontSize=30
AntiAlias=1
StringAlign=RightBottom
Padding=0,0,#SidePadding#,(#SidePadding# / 2)
X=R
Y=R
Text=%1
TooltipText=Highest rank: [measureHighestRank] on [measureHighestRankDate]
DynamicVariables=1

[meterMode]
Meter=String
DynamicVariables=1
FontFace=#IconFace#
FontSize=18
StringAlign=Right
Group=TextGroup
X=r
Padding=#PaddingSize#
AntiAlias=1
Hidden=1
LeftMouseUpAction=#PlayButtonClick#[!SetOption meterMode LeftMouseUpAction ""][!EnableMeasure measureMode][!UpdateMeasure measureMode][!UpdateMeasure measureModeIcon][!CommandMeasure measureData Update][!UpdateMeter meterMode][!Redraw]
ToolTipText=[measureModeName]
ToolTipTitle=Mode

[meterDropdownBackground]
Meter=Shape
Shape=Rectangle 0,0,[meterDropdown:W],[meterDropdown:H],#CornerRadius# | Fill LinearGradient Gradient | StrokeWidth 0
Shape2=Rectangle 0,-#CornerRadius#,[meterDropdown:W],[meterDropdown:H],0
Shape3=Rectangle 0,(-#CornerRadius# * 2),[meterDropdown:W],(#CornerRadius# * 2),#CornerRadius#
Shape4=Combine Shape | Union Shape2 | Exclude Shape3
;add placeholder option to hide errors
Gradient=0 | 0,0,0,0 ; 0.0
DynamicVariables=1
Group=OpaqueBackgroundGroup
Y=[meterCard:H]

[meterDropdown]
Meter=Image
DynamicVariables=1
W=([meterAvatar:W] + #InfoWidth#)
SolidColor=0,0,0
Y=r
Hidden=1

[styleGrade]
Container=meterDropdown
DynamicVariables=1
FontFace=#IconFace#
FontSize=18
AntiAlias=1
Y=(#DropdownHeight# / 3)
StringAlign=CenterCenter

[styleCounter]
FontFace=#FontFace#
FontSize=12
AntiAlias=1
Group=TextGroup
StringAlign=CenterCenter
Y=r
Padding=0,5,0,0
Container=meterDropdown
DynamicVariables=1

[meterSSH]
Meter=String
Text=SS
FontColor=128,128,128
MeterStyle=styleGrade
X=(([meterAvatar:W] + #InfoWidth#) / 10)

[meterSS]
Meter=String
Text=SS
FontColor=255,255,0
MeterStyle=styleGrade
X=(3 * ([meterAvatar:W] + #InfoWidth#) / 10)

[meterSH]
Meter=String
Text=S
FontColor=128,128,128
MeterStyle=styleGrade
X=(([meterAvatar:W] + #InfoWidth#) / 2)

[meterS]
Meter=String
Text=S
FontColor=255,255,0
MeterStyle=styleGrade
X=(7 * ([meterAvatar:W] + #InfoWidth#) / 10)

[meterA]
Meter=String
Text=A
FontColor=3,192,60
MeterStyle=styleGrade
X=(9 * ([meterAvatar:W] + #InfoWidth#) / 10)

[meterSSHCounter]
Meter=String
MeasureName=measureSSH
MeterStyle=styleCounter
Y=R
X=(([meterAvatar:W] + #InfoWidth#) / 10)

[meterSSCounter]
Meter=String
MeasureName=measureSS
MeterStyle=styleCounter
X=(3 * ([meterAvatar:W] + #InfoWidth#) / 10)

[meterSHCounter]
Meter=String
MeasureName=measureSH
MeterStyle=styleCounter
X=(([meterAvatar:W] + #InfoWidth#) / 2)

[meterSCounter]
Meter=String
MeasureName=measureS
MeterStyle=styleCounter
X=(7 * ([meterAvatar:W] + #InfoWidth#) / 10)

[meterACounter]
Meter=String
MeasureName=measureA
MeterStyle=styleCounter
X=(9 * ([meterAvatar:W] + #InfoWidth#) / 10)

[measureInput]
Measure=Plugin
Plugin=InputText
X=([meterAvatar:W] + #SidePadding#)
Y=#SidePadding#
W=(#InfoWidth# - [meterMode:W] - #SidePadding#)
H=29
Group=TextGroup | TextBoxGroup
FontSize=18
FontFace=#FontFace#
AntiAlias=1
DefaultValue=enter username
; score refresh handled by user id change
Command1=[!WriteKeyValue Variables Username "$UserInput$" "#@#Variables/tokenvariables.inc"][!Refresh]

[meterClick]
Meter=Image
DynamicVariables=1
X=([meterAvatar:W] + #SidePadding#)
Y=#SidePadding#
W=(#InfoWidth# - [meterMode:W] - #SidePadding#)
H=29
SolidColor=#ClickableTransparentColor#
AntiAlias=1
LeftMouseUpAction=#PlayButtonClick#[!CommandMeasure measureInput "ExecuteBatch 1"]
RightMouseUpAction=#PlayButtonClick#["https://osu.ppy.sh/users/#UserID#"]
ToolTipTitle=Actions

[measureSystemTheme]
IfTrueAction5=#SetDarkModeGradient#[!SetOption meterRank FontColor #DarkFontColor#,150]
IfTrueAction6=#SetLightMode#[!SetOption meterRank FontColor #LightFontColor#,150]
IfTrueAction7=#SetLightModeGradient#[!SetOption meterRank FontColor #LightFontColor#,150]
IfTrueAction8=#SetDarkMode#[!SetOption meterRank FontColor #DarkFontColor#,150]

[measureLightMode]
IfTrueAction=#SetDarkModeGradient#[!SetOption meterRank FontColor #DarkFontColor#,150]
IfTrueAction2=#SetLightMode#[!SetOption meterRank FontColor #LightFontColor#,150]
IfTrueAction3=#SetLightModeGradient#[!SetOption meterRank FontColor #LightFontColor#,150]
IfTrueAction4=#SetDarkMode#[!SetOption meterRank FontColor #DarkFontColor#,150]
